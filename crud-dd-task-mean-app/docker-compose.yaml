version: "3.9"

services:
  mongo:
    image: mongo:6-jammy
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: tutorials_db
    volumes:
      - mongo_data:/data/db
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      DB_URL: mongodb://mongo:27017/tutorials_db
      PORT: 8080
      NODE_ENV: production
    networks:
      - app-network
    ports:
      - "8080:8080"   # host port 8080 -> backend container

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "8081:80"     # host port 8081 -> frontend container

networks:
  app-network:
    driver: bridge

volumes:
  mongo_data: